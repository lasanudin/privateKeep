<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrivateKeep</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f0e8; --surface:#fffdf7; --ink:#1a1714; --ink-muted:#6b6560;
    --accent:#e8521a; --border:#e2ddd5;
    --shadow:2px 3px 0px #c8c3bc; --shadow-hover:4px 6px 0px #b8b3ac;
    --tab-kyp:#dbeafe; --tab-resume:#d1fae5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

  /* SPLASH */
  #splash{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
  #splash.hidden{display:none;}
  .splash-logo{font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:700;display:flex;align-items:center;gap:12px;}
  .splash-logo-icon{width:52px;height:52px;background:var(--accent);border:2px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:4px 4px 0 var(--ink);}
  .splash-sub{font-size:14px;color:var(--ink-muted);font-style:italic;}
  .splash-status{font-size:13px;color:var(--ink-muted);min-height:20px;text-align:center;max-width:320px;}
  .btn-google{display:flex;align-items:center;gap:10px;padding:12px 24px;background:white;color:#1a1714;border:2px solid var(--ink);border-radius:8px;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:all .15s;}
  .btn-google:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  .btn-google img{width:20px;height:20px;}
  .btn-skip{font-size:12px;color:var(--ink-muted);background:none;border:none;cursor:pointer;text-decoration:underline;}
  .btn-skip:hover{color:var(--ink);}
  .setup-box{background:white;border:2px solid var(--ink);border-radius:12px;padding:20px 24px;max-width:360px;width:100%;box-shadow:var(--shadow);display:none;flex-direction:column;gap:10px;}
  .setup-box.visible{display:flex;}
  .setup-box label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);}
  .setup-box input{border:2px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s;}
  .setup-box input:focus{border-color:var(--ink);}
  .btn-setup{padding:8px 20px;background:var(--accent);color:white;border:2px solid var(--ink);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all .15s;}
  .btn-setup:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
  .setup-hint{font-size:11px;color:var(--ink-muted);line-height:1.6;}
  .setup-link{color:var(--accent);text-decoration:none;}

  /* SYNC STATUS */
  .sync-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);white-space:nowrap;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;}
  .sync-dot.synced{background:#16a34a;}
  .sync-dot.syncing{background:#f59e0b;animation:pulse .8s infinite;}
  .sync-dot.error{background:#dc2626;}
  .sync-dot.offline{background:var(--border);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sync-label{display:none;}
  @media(min-width:700px){.sync-label{display:inline;}}

  /* HEADER */
  header{background:var(--surface);border-bottom:2px solid var(--ink);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .logo-icon{width:30px;height:30px;background:var(--accent);border:2px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;box-shadow:2px 2px 0 var(--ink);flex-shrink:0;}
  .search-bar{flex:1;max-width:480px;position:relative;}
  .search-bar input{width:100%;padding:8px 16px 8px 40px;border:2px solid var(--border);border-radius:24px;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s;}
  .search-bar input:focus{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);}
  .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-muted);font-size:16px;pointer-events:none;}
  .header-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .view-toggle{display:flex;gap:4px;}
  .view-btn{width:34px;height:34px;border:2px solid var(--border);background:transparent;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;}
  .view-btn.active,.view-btn:hover{border-color:var(--ink);background:var(--ink);color:white;}

  /* MAIN */
  main{max-width:1200px;margin:0 auto;padding:32px 24px;}

  /* CREATE */
  .create-note{background:var(--surface);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:20px;margin-bottom:40px;max-width:640px;margin-left:auto;margin-right:auto;transition:box-shadow .2s;}
  .create-note:focus-within{box-shadow:var(--shadow-hover);}
  .create-title{width:100%;border:none;outline:none;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:600;background:transparent;color:var(--ink);margin-bottom:8px;display:none;}
  .create-title.visible{display:block;}
  .create-body{width:100%;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;background:transparent;color:var(--ink);resize:none;min-height:24px;line-height:1.6;overflow:hidden;}
  .create-footer{display:none;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .create-footer.visible{display:flex;}
  .color-picker{display:flex;gap:6px;}
  .color-dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;}
  .color-dot:hover,.color-dot.selected{transform:scale(1.2);border-color:var(--ink);}
  .btn-save{padding:6px 18px;background:var(--accent);color:white;border:2px solid var(--ink);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all .15s;}
  .btn-save:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}

  /* SECTION */
  .section-label{font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:16px;}
  .notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .notes-grid.list-view{grid-template-columns:1fr;max-width:640px;margin:0 auto;}

  /* NOTE CARD */
  .note-card{background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;position:relative;animation:noteIn .25s ease both;}
  @keyframes noteIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .note-card:hover{box-shadow:var(--shadow-hover);transform:translate(-1px,-2px);}
  .note-card .note-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;margin-bottom:6px;line-height:1.3;}
  .note-card .note-body{font-size:13px;color:var(--ink-muted);line-height:1.6;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .note-card .note-date{font-size:11px;color:var(--ink-muted);margin-top:10px;font-style:italic;}
  .card-thumbs{display:grid;gap:4px;margin-bottom:10px;}
  .card-thumbs.count-1{grid-template-columns:1fr;}
  .card-thumbs.count-2{grid-template-columns:1fr 1fr;}
  .card-thumbs.count-3,.card-thumbs.count-many{grid-template-columns:1fr 1fr 1fr;}
  .card-thumbs.count-1 .card-thumb-item{height:110px;}
  .card-thumbs.count-2 .card-thumb-item{height:80px;}
  .card-thumbs.count-3 .card-thumb-item,.card-thumbs.count-many .card-thumb-item{height:68px;}
  .card-thumb-item{position:relative;overflow:hidden;border-radius:5px;border:1.5px solid var(--border);}
  .card-thumb-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;transition:transform .15s,opacity .15s;}
  .card-thumb-item img:hover{transform:scale(1.05);opacity:.88;}
  .card-thumb-more{position:absolute;inset:0;background:rgba(26,23,20,.55);display:flex;align-items:center;justify-content:center;color:white;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;pointer-events:none;}
  .card-badges{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;}
  .card-badge{font-size:10px;padding:2px 7px;border-radius:4px;border:1.5px solid var(--ink);font-weight:700;letter-spacing:.3px;}
  .badge-kyp{background:var(--tab-kyp);}
  .badge-resume{background:var(--tab-resume);}
  .badge-img{background:#fef9c3;}
  .note-actions{position:absolute;top:8px;right:8px;display:none;gap:4px;}
  .note-card:hover .note-actions{display:flex;}
  .note-action-btn{width:28px;height:28px;border:1.5px solid var(--border);background:var(--surface);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
  .note-action-btn:hover{border-color:var(--ink);background:var(--ink);color:white;}
  .pin-badge{position:absolute;top:-8px;left:12px;background:var(--accent);color:white;font-size:10px;padding:2px 6px;border-radius:4px;border:1.5px solid var(--ink);font-weight:600;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 8px 0 var(--ink);width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;animation:slideUp .2s ease;}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .modal-header{padding:20px 24px 12px;flex-shrink:0;}
  .modal-title-input{width:100%;border:none;outline:none;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;background:transparent;color:var(--ink);}
  .modal-tabs{display:flex;padding:0 24px;border-bottom:2px solid var(--ink);flex-shrink:0;overflow-x:auto;}
  .tab-btn{padding:8px 14px;font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:600;letter-spacing:.3px;border:2px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;background:var(--bg);color:var(--ink-muted);margin-right:4px;transition:background .15s,color .15s;position:relative;bottom:-2px;white-space:nowrap;flex-shrink:0;}
  .tab-btn.active{color:var(--ink);z-index:1;}
  .tab-btn.tab-note.active{background:#fffdf7;}
  .tab-btn.tab-kyp.active{background:var(--tab-kyp);}
  .tab-btn.tab-resume.active{background:var(--tab-resume);}
  .tab-btn.tab-foto.active{background:#fef9c3;}
  .modal-panels{padding:20px 24px;overflow-y:auto;flex:1;min-height:0;}
  .tab-panel{display:none;animation:panelIn .15s ease;}
  .tab-panel.active{display:block;}
  @keyframes panelIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .tab-ta{width:100%;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.8;background:transparent;color:var(--ink);resize:none;overflow:hidden;min-height:200px;}

  /* FOTO TAB */
  .foto-upload-row{display:flex;gap:8px;margin-bottom:16px;}
  .foto-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border:2px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink-muted);transition:all .15s;box-shadow:2px 2px 0 var(--border);}
  .foto-btn:hover{border-color:var(--ink);color:var(--ink);background:var(--bg);box-shadow:2px 2px 0 var(--ink);}
  .foto-btn span.icon{font-size:15px;}
  .foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .foto-item{position:relative;border-radius:8px;overflow:hidden;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--border);animation:noteIn .2s ease;}
  .foto-item img{width:100%;height:110px;object-fit:cover;display:block;cursor:pointer;transition:opacity .15s;}
  .foto-item img:hover{opacity:.85;}
  .foto-del{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(26,23,20,.75);color:white;border:none;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .foto-del:hover{background:#e8521a;}
  .foto-empty{text-align:center;padding:32px 16px;color:var(--ink-muted);font-size:13px;font-style:italic;}
  .foto-uploading{text-align:center;padding:16px;color:var(--ink-muted);font-size:13px;}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:85vh;border-radius:8px;border:2px solid rgba(255,255,255,.3);box-shadow:0 8px 40px rgba(0,0,0,.6);display:block;transition:opacity .25s;}
  .lightbox-close{position:absolute;top:14px;right:18px;background:none;border:none;color:white;font-size:30px;cursor:pointer;opacity:.8;}
  .lightbox-close:hover{opacity:1;}
  .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:white;font-size:24px;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .lightbox-nav:hover{background:rgba(255,255,255,.3);}
  .lightbox-prev{left:14px;}
  .lightbox-next{right:14px;}
  .lightbox-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:13px;font-family:'DM Sans',sans-serif;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:20px;}

  /* FOOTER */
  .modal-footer{padding:14px 24px;border-top:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .btn-close{padding:6px 18px;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;}
  .btn-close:hover{background:var(--bg);}

  /* MISC */
  .empty-state{text-align:center;padding:60px 24px;color:var(--ink-muted);}
  .empty-icon{font-size:48px;margin-bottom:16px;opacity:.4;}
  .empty-state p{font-size:14px;font-style:italic;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:white;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  #inputFile,#inputCamera{display:none;}

  @media(max-width:600px){
    .notes-grid{grid-template-columns:1fr;}
    header{padding:0 12px;gap:8px;}
    main{padding:20px 16px;}
    .logo span{display:none;}
    .tab-btn{padding:7px 10px;font-size:12px;}
    .modal-overlay{padding:8px;align-items:flex-end;}
    .modal{border-radius:14px 14px 8px 8px;max-height:95vh;}
  }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">
    <div class="splash-logo-icon">🩺</div>
    PrivateKeep
  </div>
  <div class="splash-sub">Catatan Pasien Pribadi</div>
  <div class="splash-status" id="splashStatus">Memuat…</div>

  <!-- Setup box — shown when firebase config not yet filled -->
  <div class="setup-box" id="setupBox">
    <div class="setup-hint">
      Isi konfigurasi Firebase Anda. Buat gratis di
      <a class="setup-link" href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a>
      — lihat panduan di bawah file ini.
    </div>
    <label>API Key</label>
    <input id="cfg-apiKey" placeholder="AIzaSy...">
    <label>Auth Domain</label>
    <input id="cfg-authDomain" placeholder="project-id.firebaseapp.com">
    <label>Project ID</label>
    <input id="cfg-projectId" placeholder="project-id">
    <label>Storage Bucket</label>
    <input id="cfg-storageBucket" placeholder="project-id.appspot.com">
    <label>App ID</label>
    <input id="cfg-appId" placeholder="1:123:web:abc">
    <button class="btn-setup" onclick="saveConfig()">Simpan &amp; Mulai</button>
  </div>

  <button class="btn-google" id="btnGoogle" style="display:none">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
    Masuk dengan Google
  </button>
  <button class="btn-skip" id="btnSkip">Lanjutkan tanpa cloud (hanya lokal)</button>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">🩺</div>
    <span>PrivateKeep</span>
  </div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Cari catatan…">
  </div>
  <div class="header-right">
    <div class="sync-status" id="syncStatus" title="Status sinkronisasi">
      <div class="sync-dot offline" id="syncDot"></div>
      <span class="sync-label" id="syncLabel">Lokal</span>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="gridBtn">⊞</button>
      <button class="view-btn"        id="listBtn">☰</button>
    </div>
  </div>
</header>

<main>
  <div class="create-note" id="createNote">
    <input type="text" class="create-title" id="createTitle" placeholder="Judul / Nama Pasien">
    <textarea class="create-body" id="createBody" placeholder="Buat catatan baru…" rows="1"></textarea>
    <div class="create-footer" id="createFooter">
      <div class="color-picker" id="colorPicker">
        <div class="color-dot selected" data-color="#fffdf7" style="background:#fffdf7"></div>
        <div class="color-dot" data-color="#fef3c7" style="background:#fef3c7"></div>
        <div class="color-dot" data-color="#d1fae5" style="background:#d1fae5"></div>
        <div class="color-dot" data-color="#dbeafe" style="background:#dbeafe"></div>
        <div class="color-dot" data-color="#fce7f3" style="background:#fce7f3"></div>
        <div class="color-dot" data-color="#ffedd5" style="background:#ffedd5"></div>
      </div>
      <button class="btn-save" id="btnSaveNote">Simpan</button>
    </div>
  </div>

  <div id="pinnedSection" style="display:none;margin-bottom:32px;">
    <div class="section-label">📌 Disematkan</div>
    <div class="notes-grid" id="pinnedGrid"></div>
  </div>

  <div id="allSection">
    <div class="section-label" id="allLabel">Semua Catatan</div>
    <div class="notes-grid" id="notesGrid"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🗒️</div>
      <p>Belum ada catatan. Mulai buat catatan baru!</p>
    </div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <input type="text" class="modal-title-input" id="modalTitle" placeholder="Judul / Nama Pasien">
    </div>
    <div class="modal-tabs">
      <button class="tab-btn tab-note active" id="tbtn-note">📝 Catatan</button>
      <button class="tab-btn tab-kyp"         id="tbtn-kyp">👤 KYP</button>
      <button class="tab-btn tab-resume"       id="tbtn-resume">📋 Resume</button>
      <button class="tab-btn tab-foto"         id="tbtn-foto">🖼️ Foto</button>
    </div>
    <div class="modal-panels" id="modalPanels">
      <div class="tab-panel active" id="panel-note">
        <textarea class="tab-ta" id="ta-note" placeholder="Tulis catatan bebas di sini…"></textarea>
      </div>
      <div class="tab-panel" id="panel-kyp">
        <textarea class="tab-ta" id="ta-kyp" placeholder="Know Your Patient — tulis informasi pasien di sini…"></textarea>
      </div>
      <div class="tab-panel" id="panel-resume">
        <textarea class="tab-ta" id="ta-resume" placeholder="Resume medis pasien — tulis di sini…"></textarea>
      </div>
      <div class="tab-panel" id="panel-foto">
        <div class="foto-upload-row">
          <button class="foto-btn" id="btnFromFile">
            <span class="icon">📁</span><span>Dari File</span>
          </button>
          <button class="foto-btn" id="btnFromCamera">
            <span class="icon">📷</span><span>Dari Kamera</span>
          </button>
        </div>

<!-- ═══════════════════════════════════════════════════════════
     FIREBASE SDK
     ═══════════════════════════════════════════════════════════ -->
<script type="module">
import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
                                                   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, query, where }
                                                   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getStorage, ref, uploadString, getDownloadURL, deleteObject }
                                                   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

/* ══ CONFIG ══════════════════════════════════════════════════
   Isi di sini ATAU lewat form di splash screen (disimpan ke localStorage).
   ════════════════════════════════════════════════════════════ */
const HARDCODED_CONFIG = {
  apiKey:        'GANTI',
  authDomain:    'GANTI',
  projectId:     'GANTI',
  storageBucket: 'GANTI',
  appId:         'GANTI'
};

const LS_KEY     = 'privateKeep_v2';
const LS_CFG_KEY = 'privateKeep_cfg';

/* ── State ── */
let notes        = [];
let editingId    = null;
let selectedColor= '#fffdf7';
let currentView  = 'grid';
let syncTimer    = null;
let useCloud     = false;
let fbApp, fbAuth, fbDb, fbStorage, fbUser;
let imgCache     = {};

/* ══ COMPRESSION ══ */
const THUMB_SIZE   = 200;
const FULL_SIZE    = 1280;
const JPEG_QUALITY = 0.82;

function compressImage(dataUrl, maxPx, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

/* ══ SYNC STATUS ══ */
function setSyncStatus(state, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

/* ══ CONFIG MANAGEMENT ══ */
function getConfig() {
  if (!HARDCODED_CONFIG.apiKey.startsWith('GANTI')) return HARDCODED_CONFIG;
  const saved = localStorage.getItem(LS_CFG_KEY);
  return saved ? JSON.parse(saved) : null;
}

window.saveConfig = function() {
  const cfg = {
    apiKey:        document.getElementById('cfg-apiKey').value.trim(),
    authDomain:    document.getElementById('cfg-authDomain').value.trim(),
    projectId:     document.getElementById('cfg-projectId').value.trim(),
    storageBucket: document.getElementById('cfg-storageBucket').value.trim(),
    appId:         document.getElementById('cfg-appId').value.trim()
  };
  if (!cfg.apiKey || !cfg.projectId) { showToast('API Key dan Project ID wajib diisi'); return; }
  localStorage.setItem(LS_CFG_KEY, JSON.stringify(cfg));
  location.reload();
};

/* ══ FIREBASE INIT ══ */
function initFirebase(cfg) {
  fbApp     = initializeApp(cfg);
  fbAuth    = getAuth(fbApp);
  fbDb      = getFirestore(fbApp);
  fbStorage = getStorage(fbApp);

  onAuthStateChanged(fbAuth, async user => {
    if (user) {
      fbUser   = user;
      useCloud = true;
      setSyncStatus('syncing', 'Memuat…');
      await loadFromFirestore();
      hideSplash();
    } else {
      fbUser   = null;
      useCloud = false;
      document.getElementById('splashStatus').textContent = 'Masuk untuk menyimpan data ke cloud.';
      document.getElementById('btnGoogle').style.display  = '';
    }
  });
}

window.signInGoogle = async function() {
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(fbAuth, provider);
    /* onAuthStateChanged will handle the rest */
  } catch(e) {
    document.getElementById('splashStatus').textContent = 'Login gagal: ' + e.message;
  }
};

window.skipCloud = function() {
  useCloud = false;
  notes    = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
  setSyncStatus('offline', 'Lokal');
  hideSplash();
  renderNotes();
};

function hideSplash() {
  document.getElementById('splash').classList.add('hidden');
  renderNotes();
}

/* ══ FIRESTORE CRUD ══ */
async function loadFromFirestore() {
  try {
    const uid  = fbUser.uid;
    const snap = await getDocs(collection(fbDb, 'users', uid, 'notes'));
    notes = [];
    snap.forEach(d => notes.push(d.data()));
    notes.sort((a,b) => b.id - a.id);
    localStorage.setItem(LS_KEY, JSON.stringify(notes));
    setSyncStatus('synced', 'Cloud ✓');
  } catch(e) {
    console.warn('Firestore load err:', e);
    notes = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    setSyncStatus('error', 'Error');
  }
}

async function saveNoteToCloud(note) {
  if (!useCloud || !fbUser) return;
  setSyncStatus('syncing', 'Menyimpan…');
  try {
    /* Strip localFull blobs before saving to Firestore (too large) */
    const toSave = { ...note, images: (note.images||[]).map(i => ({
      id: i.id, name: i.name, thumb: i.thumb, storageUrl: i.storageUrl||null
    }))};
    await setDoc(doc(fbDb, 'users', fbUser.uid, 'notes', String(note.id)), toSave);
    setSyncStatus('synced', 'Cloud ✓');
  } catch(e) {
    console.warn('Firestore save err:', e);
    setSyncStatus('error', 'Gagal simpan');
  }
}

async function deleteNoteFromCloud(note) {
  if (!useCloud || !fbUser) return;
  try {
    /* Soft-delete: move to 'trash' collection */
    const toTrash = { ...note, deletedAt: Date.now(),
      images: (note.images||[]).map(i => ({ id:i.id, name:i.name, thumb:i.thumb, storageUrl:i.storageUrl||null }))
    };
    await setDoc(doc(fbDb, 'users', fbUser.uid, 'trash', String(note.id)), toTrash);
    await deleteDoc(doc(fbDb, 'users', fbUser.uid, 'notes', String(note.id)));

    /* Move images to trash path in Storage */
    for (const img of (note.images||[])) {
      if (img.storageUrl) {
        try {
          /* Copy to trash path */
          const trashRef = ref(fbStorage, `users/${fbUser.uid}/trash/${img.name}`);
          /* Firebase Storage doesn't have a move API, so we just leave it.
             The storageUrl is preserved in the trash document for manual recovery. */
        } catch(e2) { /* ignore */ }
      }
    }
  } catch(e) {
    console.warn('Firestore delete err:', e);
  }
}

/* ══ STORAGE: upload full image ══ */
async function uploadImageToStorage(base64, filename) {
  if (!useCloud || !fbUser) return null;
  try {
    const path    = `users/${fbUser.uid}/images/${filename}`;
    const imgRef  = ref(fbStorage, path);
    await uploadString(imgRef, base64, 'data_url');
    const url = await getDownloadURL(imgRef);
    return url;
  } catch(e) {
    console.warn('Storage upload err:', e);
    return null;
  }
}

async function deleteImageFromStorage(storageUrl) {
  if (!useCloud || !fbUser || !storageUrl) return;
  try {
    /* Move to trash path instead of deleting */
    const fname    = storageUrl.split('%2F').pop().split('?')[0];
    const trashRef = ref(fbStorage, `users/${fbUser.uid}/trash_images/${fname}`);
    /* Firebase Storage has no move, so we leave original and just remove reference */
    /* The file stays until manually deleted from Firebase Console */
  } catch(e) { console.warn('Storage trash err:', e); }
}

/* ══ SAVE HELPERS ══ */
function saveToStorage() {
  localStorage.setItem(LS_KEY, JSON.stringify(notes));
}

function scheduleSave(note) {
  saveToStorage();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => saveNoteToCloud(note), 1500);
}

function saveOnClose() {
  if (!editingId) return;
  const note = notes.find(n => n.id === editingId);
  if (note) { clearTimeout(syncTimer); saveNoteToCloud(note); }
}

/* ══ UI HELPERS ══ */
function autoGrow(el) { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }
document.querySelectorAll('textarea').forEach(ta => ta.addEventListener('input',()=>autoGrow(ta)));
function panelsEl()        { return document.getElementById('modalPanels'); }
function scrollPanelsTop() { panelsEl().scrollTop = 0; }

document.getElementById('createBody').addEventListener('focus',()=>{
  document.getElementById('createTitle').classList.add('visible');
  document.getElementById('createFooter').classList.add('visible');
});

document.querySelectorAll('#colorPicker .color-dot').forEach(dot=>{
  dot.addEventListener('click',()=>{
    document.querySelectorAll('#colorPicker .color-dot').forEach(d=>d.classList.remove('selected'));
    dot.classList.add('selected'); selectedColor=dot.dataset.color;
  });
});
document.querySelectorAll('#modalColorPicker .color-dot').forEach(dot=>{
  dot.addEventListener('click',()=>{
    document.querySelectorAll('#modalColorPicker .color-dot').forEach(d=>d.classList.remove('selected'));
    dot.classList.add('selected');
    const note=notes.find(n=>n.id===editingId);
    if(note){ note.color=dot.dataset.color; scheduleSave(note); renderNotes(); }
    document.getElementById('modal').style.background=dot.dataset.color;
  });
});

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab-btn.tab-'+tab).classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  scrollPanelsTop();
  if(tab==='foto') { renderFotoGrid(); }
  else { const ta=document.getElementById('ta-'+tab); if(ta) setTimeout(()=>{autoGrow(ta);scrollPanelsTop();},0); }
}
window.switchTab = switchTab;

/* Wire tab buttons */
['note','kyp','resume','foto'].forEach(tab => {
  const btn = document.getElementById('tbtn-'+tab);
  if(btn) btn.addEventListener('click', () => switchTab(tab));
});

/* ══ NOTES CRUD ══ */
window.saveNote = function() {
  const title=document.getElementById('createTitle').value.trim();
  const body =document.getElementById('createBody').value.trim();
  if(!title&&!body) return;
  const note={
    id:Date.now(), title, body, kyp:'', resume:'', images:[],
    color:selectedColor, pinned:false,
    createdAt:new Date().toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})
  };
  notes.unshift(note);
  scheduleSave(note); renderNotes();
  document.getElementById('createTitle').value='';
  document.getElementById('createBody').value='';
  autoGrow(document.getElementById('createBody'));
  document.getElementById('createTitle').classList.remove('visible');
  document.getElementById('createFooter').classList.remove('visible');
  selectedColor='#fffdf7';
  document.querySelectorAll('#colorPicker .color-dot').forEach((d,i)=>d.classList.toggle('selected',i===0));
  showToast('Catatan disimpan!');
};
document.getElementById('createTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('createBody').focus();}});
document.getElementById('createBody').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter') window.saveNote();});

window.openNote = function(id) {
  const note=notes.find(n=>n.id===id);
  if(!note) return;
  editingId=id;
  document.getElementById('modalTitle').value=note.title||'';
  document.getElementById('ta-note').value  =note.body  ||'';
  document.getElementById('ta-kyp').value   =note.kyp   ||'';
  document.getElementById('ta-resume').value=note.resume||'';
  document.getElementById('modal').style.background=note.color||'#fffdf7';
  document.querySelectorAll('#modalColorPicker .color-dot').forEach(d=>d.classList.toggle('selected',d.dataset.color===note.color));
  document.getElementById('modalOverlay').classList.add('open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    switchTab('note');
    autoGrow(document.getElementById('ta-note'));
    scrollPanelsTop();
    document.getElementById('ta-note').focus();
    ['kyp','resume'].forEach(k=>autoGrow(document.getElementById('ta-'+k)));
    scrollPanelsTop();
  }));
  function autosave(){
    note.title =document.getElementById('modalTitle').value;
    note.body  =document.getElementById('ta-note').value;
    note.kyp   =document.getElementById('ta-kyp').value;
    note.resume=document.getElementById('ta-resume').value;
    scheduleSave(note); renderNotes();
  }
  document.getElementById('modalTitle').oninput=autosave;
  document.getElementById('ta-note').oninput  =autosave;
  document.getElementById('ta-kyp').oninput   =autosave;
  document.getElementById('ta-resume').oninput=autosave;
};

window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('open');
  saveOnClose();
  editingId=null;
};
window.closeModalOutside = function(e) { if(e.target===document.getElementById('modalOverlay')) window.closeModal(); };

window.deleteNote = async function(id, e) {
  e.stopPropagation();
  if(!confirm('Pindahkan catatan ini ke trash?')) return;
  const note=notes.find(n=>n.id===id);
  if(note) await deleteNoteFromCloud(note);
  notes=notes.filter(n=>n.id!==id);
  saveToStorage(); renderNotes();
  showToast('Catatan dipindahkan ke trash');
};

window.togglePin = function(id, e) {
  e.stopPropagation();
  const note=notes.find(n=>n.id===id);
  if(note){ note.pinned=!note.pinned; scheduleSave(note); renderNotes(); }
};

/* ══ IMAGE HANDLING ══ */
window.handleImages = async function(files) {
  const note=notes.find(n=>n.id===editingId);
  if(!note) return;
  if(!note.images) note.images=[];
  const fileArr=Array.from(files);
  document.getElementById('inputFile').value='';
  document.getElementById('inputCamera').value='';
  document.getElementById('fotoUploading').style.display='block';
  showToast(`Memproses ${fileArr.length} foto…`);

  for(const file of fileArr){
    const original=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
    const [thumb,full]=await Promise.all([
      compressImage(original,THUMB_SIZE,0.75),
      compressImage(original,FULL_SIZE,JPEG_QUALITY)
    ]);
    const imgId   = String(Date.now()+Math.random());
    const imgName = `pk_${imgId}.jpg`;
    let storageUrl= null;
    if(useCloud && fbUser) storageUrl=await uploadImageToStorage(full,imgName);
    imgCache[imgId]=full;
    note.images.push({id:imgId, name:imgName, thumb, storageUrl, localFull: storageUrl?null:full});
  }

  document.getElementById('fotoUploading').style.display='none';
  scheduleSave(note); renderNotes(); renderFotoGrid();
  showToast(`${fileArr.length} foto ditambahkan`);
};

window.deleteImage = async function(imgId) {
  const note=notes.find(n=>n.id===editingId);
  if(!note) return;
  const img=note.images.find(i=>i.id===imgId);
  if(img && img.storageUrl) await deleteImageFromStorage(img.storageUrl);
  delete imgCache[imgId];
  note.images=note.images.filter(i=>i.id!==imgId);
  scheduleSave(note); renderNotes(); renderFotoGrid();
};

function renderFotoGrid(){
  const note  =notes.find(n=>n.id===editingId);
  const images=(note&&note.images)||[];
  document.getElementById('fotoEmpty').style.display=images.length?'none':'block';
  document.getElementById('fotoGrid').innerHTML=images.map(img=>`
    <div class="foto-item">
      <img src="${img.thumb}" alt="foto" onclick="openLightbox(${editingId},'${img.id}')">
      <button class="foto-del" onclick="deleteImage('${img.id}')" title="Hapus">✕</button>
    </div>`).join('');
}

/* ══ LIGHTBOX ══ */
let lbImages=[],lbIndex=0;

window.openLightbox = async function(noteId,imgId){
  const note=notes.find(n=>n.id==noteId);
  if(!note||!note.images||!note.images.length) return;
  lbImages=note.images;
  lbIndex=imgId!=null?lbImages.findIndex(i=>i.id==imgId):0;
  if(lbIndex<0) lbIndex=0;
  await lbShow();
};

async function lbShow(){
  const img=lbImages[lbIndex];
  const el =document.getElementById('lightboxImg');
  el.src=img.thumb||''; el.style.opacity='0.5';
  document.getElementById('lightbox').classList.add('open');
  document.getElementById('lightboxCounter').textContent=lbImages.length>1?`${lbIndex+1} / ${lbImages.length}`:'';
  document.querySelector('.lightbox-prev').style.display=lbImages.length>1?'':'none';
  document.querySelector('.lightbox-next').style.display=lbImages.length>1?'':'none';
  try{
    let full;
    if(imgCache[img.id])          { full=imgCache[img.id]; }
    else if(img.storageUrl)       { full=img.storageUrl; imgCache[img.id]=full; }
    else if(img.localFull)        { full=img.localFull; imgCache[img.id]=full; }
    else                          { full=img.thumb; }
    if(lbImages[lbIndex]&&lbImages[lbIndex].id===img.id){ el.src=full; el.style.opacity='1'; }
  }catch(e){ el.style.opacity='1'; }
}

window.lightboxNav = function(dir){ lbIndex=(lbIndex+dir+lbImages.length)%lbImages.length; lbShow(); };
window.lightboxBgClick = function(e){ if(e.target===document.getElementById('lightbox')) window.closeLightbox(); };
window.closeLightbox = function(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightboxImg').src='';
  lbImages=[];lbIndex=0;
};

/* ══ RENDER ══ */
function hasKYP(n)    { return n.kyp    && n.kyp.trim(); }
function hasResume(n) { return n.resume && n.resume.trim(); }
function hasImages(n) { return n.images && n.images.length>0; }

function renderNotes(query=''){
  const q=query.toLowerCase();
  const filtered=notes.filter(n=>(n.title+' '+n.body+' '+(n.kyp||'')+' '+(n.resume||'')).toLowerCase().includes(q));
  const pinned=filtered.filter(n=>n.pinned), unpinned=filtered.filter(n=>!n.pinned);
  document.getElementById('pinnedSection').style.display=pinned.length?'block':'none';
  document.getElementById('pinnedGrid').innerHTML=pinned.map(cardHTML).join('');
  document.getElementById('notesGrid').innerHTML=unpinned.map(cardHTML).join('');
  document.getElementById('emptyState').style.display=filtered.length===0?'block':'none';
  document.getElementById('allLabel').textContent=query?`Hasil Pencarian (${filtered.length})`:'Semua Catatan';
}

function cardHTML(note){
  let thumbsHTML='';
  if(hasImages(note)){
    const imgs=note.images,total=imgs.length,show=Math.min(total,3);
    const cc=total===1?'count-1':total===2?'count-2':total===3?'count-3':'count-many';
    const items=imgs.slice(0,show).map((img,i)=>{
      const isLast=i===show-1&&total>3;
      return `<div class="card-thumb-item">
        <img src="${img.thumb}" alt="foto" onclick="event.stopPropagation();openLightbox(${note.id},'${img.id}')">
        ${isLast?`<div class="card-thumb-more">+${total-show+1}</div>`:''}
      </div>`;
    }).join('');
    thumbsHTML=`<div class="card-thumbs ${cc}">${items}</div>`;
  }
  const badges=[
    hasKYP(note)   ?'<span class="card-badge badge-kyp">👤 KYP</span>'      :'',
    hasResume(note)?'<span class="card-badge badge-resume">📋 Resume</span>':'',
    hasImages(note)?`<span class="card-badge badge-img">🖼️ ${note.images.length}</span>`:''
  ].join('');
  return `
    <div class="note-card" style="background:${note.color||'#fffdf7'}" onclick="openNote(${note.id})">
      ${note.pinned?'<div class="pin-badge">📌 Pin</div>':''}
      <div class="note-actions">
        <button class="note-action-btn" onclick="togglePin(${note.id},event)">${note.pinned?'📌':'📍'}</button>
        <button class="note-action-btn" onclick="deleteNote(${note.id},event)">🗑️</button>
      </div>
      ${thumbsHTML}
      ${note.title?`<div class="note-title">${escHtml(note.title)}</div>`:''}
      ${note.body ?`<div class="note-body">${escHtml(note.body)}</div>`:''}
      ${badges?`<div class="card-badges">${badges}</div>`:''}
      <div class="note-date">${note.createdAt}</div>
    </div>`;
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

window.setView = function(v){
  currentView=v;
  document.getElementById('gridBtn').classList.toggle('active',v==='grid');
  document.getElementById('listBtn').classList.toggle('active',v==='list');
  ['pinnedGrid','notesGrid'].forEach(id=>document.getElementById(id).classList.toggle('list-view',v==='list'));
  window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;
  setTimeout(()=>window.scrollTo(0,0),0);
};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
window.showToast=showToast;

document.getElementById('searchInput').addEventListener('input',e=>renderNotes(e.target.value));
document.addEventListener('keydown',e=>{
  if(document.getElementById('lightbox').classList.contains('open')){
    if(e.key==='ArrowLeft')  window.lightboxNav(-1);
    if(e.key==='ArrowRight') window.lightboxNav(1);
    if(e.key==='Escape')     window.closeLightbox();
    return;
  }
  if(e.key==='Escape') window.closeModal();
});
document.addEventListener('click',e=>{
  const cn=document.getElementById('createNote');
  if(!cn.contains(e.target)){
    if(!document.getElementById('createBody').value&&!document.getElementById('createTitle').value){
      document.getElementById('createTitle').classList.remove('visible');
      document.getElementById('createFooter').classList.remove('visible');
    }
  }
});

/* ══ WIRE ALL BUTTONS ══ */
(function wireButtons(){
  /* Splash */
  document.getElementById('btnGoogle').addEventListener('click', signInGoogle);
  document.getElementById('btnSkip').addEventListener('click', skipCloud);

  /* Header */
  document.getElementById('gridBtn').addEventListener('click', () => window.setView('grid'));
  document.getElementById('listBtn').addEventListener('click', () => window.setView('list'));

  /* Create note */
  document.getElementById('btnSaveNote').addEventListener('click', window.saveNote);

  /* Modal */
  document.getElementById('btnModalClose').addEventListener('click', window.closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if(e.target === document.getElementById('modalOverlay')) window.closeModal();
  });

  /* Foto upload */
  document.getElementById('btnFromFile').addEventListener('click', () => document.getElementById('inputFile').click());
  document.getElementById('btnFromCamera').addEventListener('click', () => document.getElementById('inputCamera').click());

  /* Lightbox */
  document.getElementById('btnLbClose').addEventListener('click', window.closeLightbox);
  document.getElementById('btnLbPrev').addEventListener('click', () => window.lightboxNav(-1));
  document.getElementById('btnLbNext').addEventListener('click', () => window.lightboxNav(1));
  document.getElementById('lightbox').addEventListener('click', e => {
    if(e.target === document.getElementById('lightbox')) window.closeLightbox();
  });
})();

/* ══ BOOT ══ */
(function boot(){
  const cfg=getConfig();
  if(cfg && !cfg.apiKey.startsWith('GANTI')){
    document.getElementById('splashStatus').textContent='Menghubungkan…';
    initFirebase(cfg);
  } else {
    /* Show setup form */
    document.getElementById('splashStatus').textContent='Isi konfigurasi Firebase untuk memulai.';
    document.getElementById('setupBox').classList.add('visible');
    /* Also allow local mode */
  }
})();

</script>
